name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke run on mingli demo
        run: python scan.py examples/mingli/demo_chat.txt

      - name: Smoke run on mingli clean control
        run: python scan.py gold/mingli/clean_chat.txt

      - name: Smoke run on shazhupan demo (identity check)
        run: python scan.py examples/shazhupan/demo_chat.txt --track shazhupan

      - name: Smoke run on shazhupan clean control
        run: python scan.py gold/shazhupan/clean_chat.txt --track shazhupan

      - name: Unknown track must fail
        run: |
          set +e
          python scan.py examples/mingli/demo_chat.txt --track nope
          code=$?
          set -e
          test $code -ne 0

      - name: Regression tests
        run: python tests/test_scan.py
