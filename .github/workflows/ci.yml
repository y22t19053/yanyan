name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke run on demo
        run: python scan.py examples/demo_chat.txt

      - name: Smoke run on clean control
        run: python scan.py gold/clean_chat.txt

      - name: Regression tests
        run: python tests/test_scan.py
